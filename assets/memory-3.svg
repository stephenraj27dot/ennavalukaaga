<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1238"/>
      <stop offset="50%" stop-color="#36184E"/>
      <stop offset="100%" stop-color="#55225E"/>
    </linearGradient>
    <radialGradient id="funGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E1238" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="450" fill="url(#skyGrad3)"/>
  <circle cx="300" cy="220" r="160" fill="url(#funGlow)"/>
  
  <!-- Playful Stars & Confetti Sparkles -->
  <g fill="#FFF" opacity="0.8">
    <circle cx="90" cy="70" r="2"/>
    <circle cx="160" cy="110" r="1.5"/>
    <circle cx="480" cy="80" r="2"/>
    <circle cx="520" cy="140" r="1.5"/>
    <circle cx="120" cy="290" r="2"/>
    <circle cx="490" cy="280" r="1.8"/>
  </g>
  <!-- Colorful Confetti Pieces -->
  <rect x="180" y="90" width="8" height="14" rx="2" fill="#F472B6" transform="rotate(25 180 90)"/>
  <rect x="420" y="110" width="10" height="6" rx="2" fill="#FDE047" transform="rotate(-30 420 110)"/>
  <rect x="130" y="180" width="8" height="12" rx="2" fill="#A78BFA" transform="rotate(45 130 180)"/>
  <rect x="450" y="210" width="6" height="14" rx="2" fill="#34D399" transform="rotate(-15 450 210)"/>
  <circle cx="210" cy="150" r="5" fill="#F472B6"/>
  <circle cx="390" cy="140" r="4" fill="#FDE047"/>
  
  <!-- Two Cute Clinking Warm Cups with Steam Hearts -->
  <g transform="translate(190, 160)">
    <!-- Cup 1 (Left - Pinkish Purple) -->
    <rect x="30" y="70" width="65" height="75" rx="14" fill="#E879F9"/>
    <rect x="35" y="75" width="55" height="65" rx="10" fill="#C026D3"/>
    <!-- Handle 1 -->
    <path d="M30 85 C10 85 10 120 30 120" stroke="#E879F9" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Cute Eyes & Big Happy Smile -->
    <circle cx="50" cy="98" r="4" fill="#FFF"/>
    <circle cx="75" cy="98" r="4" fill="#FFF"/>
    <path d="M52 110 Q62 122 73 110" stroke="#FFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Blush -->
    <ellipse cx="43" cy="107" rx="5" ry="3" fill="#F472B6" opacity="0.8"/>
    <ellipse cx="82" cy="107" rx="5" ry="3" fill="#F472B6" opacity="0.8"/>

    <!-- Cup 2 (Right - Warm Gold/Amber) Clinking -->
    <g transform="rotate(-12 150 110)">
      <rect x="130" y="70" width="65" height="75" rx="14" fill="#FBBF24"/>
      <rect x="135" y="75" width="55" height="65" rx="10" fill="#D97706"/>
      <!-- Handle 2 -->
      <path d="M195 85 C215 85 215 120 195 120" stroke="#FBBF24" stroke-width="8" stroke-linecap="round" fill="none"/>
      <!-- Cute Closed Winking / Laughing Eyes -->
      <path d="M145 98 Q152 92 159 98" stroke="#FFF" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M168 98 Q175 92 182 98" stroke="#FFF" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M152 110 Q163 125 174 110" stroke="#FFF" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Blush -->
      <ellipse cx="142" cy="107" rx="5" ry="3" fill="#F43F5E" opacity="0.7"/>
      <ellipse cx="184" cy="107" rx="5" ry="3" fill="#F43F5E" opacity="0.7"/>
    </g>
    
    <!-- Heart Shaped Steam Rising & Laugh sparkles -->
    <path d="M60 45 C60 38 52 32 46 38 C40 32 32 38 32 45 C32 55 46 62 46 62 C46 62 60 55 60 45 Z" fill="#F472B6"/>
    <path d="M170 35 C170 28 162 22 156 28 C150 22 142 28 142 35 C142 45 156 52 156 52 C156 52 170 45 170 35 Z" fill="#FDE047"/>
    
    <!-- Central Laugh Burst "HA HA" Heart -->
    <circle cx="112" cy="65" r="18" fill="#F43F5E"/>
    <text x="112" y="70" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" text-anchor="middle">❤️</text>
  </g>
  
  <!-- Caption Ribbon -->
  <rect x="200" y="405" width="200" height="28" rx="14" fill="#000" opacity="0.4"/>
  <text x="300" y="424" fill="#FCE7F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">A FUNNY MOMENT</text>
</svg>
