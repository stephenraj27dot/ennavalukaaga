<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22103E"/>
      <stop offset="60%" stop-color="#3D1854"/>
      <stop offset="100%" stop-color="#5B225E"/>
    </linearGradient>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22103E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="450" fill="url(#skyGrad2)"/>
  
  <!-- Ambient Bokeh Circles -->
  <circle cx="150" cy="120" r="60" fill="#F472B6" opacity="0.1"/>
  <circle cx="480" cy="180" r="80" fill="#DDD6FE" opacity="0.12"/>
  <circle cx="300" cy="220" r="140" fill="url(#heartGlow)"/>
  <circle cx="300" cy="220" r="50" fill="url(#ringGlow)"/>
  
  <!-- Twinkle Stars -->
  <g fill="#FFF" opacity="0.85">
    <circle cx="100" cy="80" r="2"/>
    <circle cx="200" cy="60" r="1.5"/>
    <circle cx="420" cy="90" r="2"/>
    <circle cx="510" cy="70" r="1.5"/>
    <circle cx="120" cy="260" r="1"/>
    <circle cx="500" cy="320" r="1.5"/>
  </g>
  <path d="M420 84 L422 90 L428 92 L422 94 L420 100 L418 94 L412 92 L418 90 Z" fill="#FDE047"/>
  
  <!-- Hand-in-Hand Silhouette Line Illustration -->
  <g transform="translate(180, 110)">
    <!-- Romantic Central Big Heart -->
    <path d="M120 70 C120 50 100 30 75 30 C50 30 35 50 35 70 C35 110 120 160 120 160 C120 160 205 110 205 70 C205 50 190 30 165 30 C140 30 120 50 120 70 Z" fill="#F472B6" opacity="0.45"/>
    
    <!-- Stylized Hands Interlocking -->
    <path d="M20 230 C60 190 90 170 120 180 C135 185 150 175 160 165 C175 150 190 145 220 190" stroke="#FFFDF9" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M50 245 C80 205 110 188 135 195 C145 200 160 190 180 180 C195 170 215 165 240 210" stroke="#FDE047" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
    
    <!-- Little Sparkles around hands -->
    <circle cx="140" cy="160" r="4" fill="#FFF"/>
    <circle cx="165" cy="140" r="3" fill="#FDE047"/>
    <circle cx="110" cy="150" r="2.5" fill="#F472B6"/>
  </g>
  
  <!-- Caption Ribbon -->
  <rect x="165" y="405" width="270" height="28" rx="14" fill="#000" opacity="0.4"/>
  <text x="300" y="424" fill="#FCE7F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">OUR FIRST SPECIAL MEMORY</text>
</svg>
